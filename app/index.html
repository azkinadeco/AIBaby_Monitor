<!doctype html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0B0D1A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Baby Monitor">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="AI Baby Monitor — ubah dua HP menjadi kamera bayi & monitor orang tua dengan deteksi tangisan, alarm, dan jurnal tidur.">
  <title>AI Baby Monitor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" sizes="180x180">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="stage">
    <div class="device" id="device">
      <div class="net-banner hidden" id="net-banner" role="status"></div>
      <main id="screen" class="screen"></main>
      <nav id="tabbar" class="tabbar hidden" aria-label="Navigasi utama"></nav>
      <div id="overlay-root"></div>
      <div id="toast-root" aria-live="polite"></div>
    </div>
    <aside id="side" class="side hidden" aria-label="Panel simulasi"></aside>
  </div>
  <noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
</body>
</html>
